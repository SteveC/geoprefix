[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoprefix-client"
version = "0.1.0"
description = "Small standard-library GeoPrefix API client"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["geoprefix"]
