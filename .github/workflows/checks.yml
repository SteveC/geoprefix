name: Check service and clients
on: [push, pull_request]
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test sdks/javascript/geoprefix.test.js
      - run: node --check web/app.js
      - run: node --check web/tools.js
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
        working-directory: sdks/dart
      - run: dart analyze
        working-directory: sdks/dart
      - run: dart run test/geoprefix_test.dart
        working-directory: sdks/dart
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Assemble Android library
        run: gradle --no-daemon --stacktrace assembleRelease
        working-directory: sdks/android
      - uses: actions/upload-artifact@v4
        with:
          name: geoprefix-android-aar
          path: sdks/android/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 7
  swift:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift package
        run: swift build --configuration release
        working-directory: sdks/swift
